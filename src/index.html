<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>To do list</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body style="height: 100vh;" class=" bg-blue-950 flex justify-center items-center
">

    <div class="w-3/5 h-full flex flex-col gap-12 justify-center items-center" id="container">
        <div class="w-full flex h-12 justify-center">
            <input type="text" id="toDo" class="border-1 bg-amber-100 w-3/5 pl-10">
            <button type="button" id="addButton" class="bg-black p-4 w-1/4 text-xl font-bold text-gray-400 hover:bg-amber-300 hover:text-gray-100 transition-colors duration-300 ease-in-out">ajouter</button>
        </div>
        <p style="display: none;" id="warning" class="text-red-400 font-bold text-xl mt-5 opacity-0 transition-all duration-200 ">Veuillez entrer quelque chose !.....</p>
    </div>
    
    
    


    <script src="./app.js"></script>
</body>
</html>
